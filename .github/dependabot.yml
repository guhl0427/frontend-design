version: 2

# 版本漂移的自动化：Actions 大版本会因 Node 运行时升级而停用旧版，
# npm 侧则交给人工判断（React / TypeScript 次版本可能带破坏性变更）。
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    ignore:
      # 大版本升级需要人工评估（Tailwind 4 / React 19 / TS 6 均已做过专门升级）
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
